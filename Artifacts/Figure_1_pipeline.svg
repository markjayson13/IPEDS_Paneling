<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <defs>
    <style type="text/css"><![CDATA[
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; rx: 10; ry: 10; }
      .qc  { fill: #f9fafb; stroke: #6b7280; stroke-width: 1.6; rx: 10; ry: 10; }
      .title { font: 22px "Helvetica Neue", Arial, sans-serif; fill: #111827; font-weight: 700; }
      .label { font: 16px "Helvetica Neue", Arial, sans-serif; fill: #111827; font-weight: 600; }
      .small { font: 13px "Helvetica Neue", Arial, sans-serif; fill: #374151; }
      .arrow { stroke: #1f2937; stroke-width: 2.2; marker-end: url(#arrowhead); }
    ]]></style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f2937"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="980" fill="#ffffff"/>
  <text x="60" y="60" class="title">Figure 1. IPEDS Harmonization Pipeline (2004-2024)</text>

  <!-- Main vertical flow -->
  <rect x="120" y="110" width="520" height="90" class="box"/>
  <text x="140" y="145" class="label">Raw Data Ingestion</text>
  <text x="140" y="168" class="small">Cross-section CSVs by year</text>

  <rect x="120" y="230" width="520" height="90" class="box"/>
  <text x="140" y="265" class="label">Dictionary Lake + Codes</text>
  <text x="140" y="288" class="small">Canonical varname/varnumber + labels</text>

  <rect x="120" y="350" width="520" height="90" class="box"/>
  <text x="140" y="385" class="label">Long Panel (Authoritative)</text>
  <text x="140" y="408" class="small">One row per (UNITID, year, varname)</text>

  <rect x="120" y="470" width="520" height="90" class="box"/>
  <text x="140" y="505" class="label">Wide Panel (Raw)</text>
  <text x="140" y="528" class="small">Unit-year rows, all variables as columns</text>

  <rect x="120" y="590" width="520" height="90" class="box"/>
  <text x="140" y="625" class="label">Parent/Child Clean (PRCH)</text>
  <text x="140" y="648" class="small">Null child component data, keep all rows</text>

  <rect x="120" y="710" width="520" height="90" class="box"/>
  <text x="140" y="745" class="label">Research-Ready Panel</text>
  <text x="140" y="768" class="small">Optional drop of imputation flags</text>

  <rect x="120" y="830" width="520" height="90" class="box"/>
  <text x="140" y="865" class="label">Custom Panel Builder</text>
  <text x="140" y="888" class="small">User-selected variables + years</text>

  <!-- QC column -->
  <rect x="760" y="230" width="520" height="90" class="qc"/>
  <text x="780" y="265" class="label">Release-Stage QC</text>
  <text x="780" y="288" class="small">Revised/Final enforcement + evidence</text>

  <rect x="760" y="430" width="520" height="90" class="qc"/>
  <text x="780" y="465" class="label">Mapping and Schema QC</text>
  <text x="780" y="488" class="small">Dictionary coverage + unmapped headers</text>

  <rect x="760" y="550" width="520" height="90" class="qc"/>
  <text x="780" y="585" class="label">Discrete Collapse QC</text>
  <text x="780" y="608" class="small">Mutual-exclusivity conflicts logged</text>

  <rect x="760" y="670" width="520" height="90" class="qc"/>
  <text x="780" y="705" class="label">Parent/Child QC</text>
  <text x="780" y="728" class="small">Child rows identified + fields nulled</text>

  <rect x="760" y="790" width="520" height="90" class="qc"/>
  <text x="780" y="825" class="label">Panel QA Summary</text>
  <text x="780" y="848" class="small">Raw vs PRCH vs Clean comparison</text>

  <!-- Arrows (main flow) -->
  <line x1="380" y1="200" x2="380" y2="230" class="arrow"/>
  <line x1="380" y1="320" x2="380" y2="350" class="arrow"/>
  <line x1="380" y1="440" x2="380" y2="470" class="arrow"/>
  <line x1="380" y1="560" x2="380" y2="590" class="arrow"/>
  <line x1="380" y1="680" x2="380" y2="710" class="arrow"/>
  <line x1="380" y1="800" x2="380" y2="830" class="arrow"/>

  <!-- QC connectors -->
  <line x1="640" y1="275" x2="760" y2="275" class="arrow"/>
  <line x1="640" y1="395" x2="760" y2="475" class="arrow"/>
  <line x1="640" y1="515" x2="760" y2="595" class="arrow"/>
  <line x1="640" y1="635" x2="760" y2="715" class="arrow"/>
  <line x1="640" y1="755" x2="760" y2="835" class="arrow"/>
</svg>
