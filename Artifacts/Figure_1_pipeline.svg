<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <style type="text/css"><![CDATA[
      .box { fill: #ffffff; stroke: #1f2937; stroke-width: 2; }
      .title { font: 20px "Helvetica Neue", Arial, sans-serif; fill: #111827; font-weight: 700; }
      .label { font: 16px "Helvetica Neue", Arial, sans-serif; fill: #111827; }
      .small { font: 13px "Helvetica Neue", Arial, sans-serif; fill: #374151; }
      .arrow { stroke: #1f2937; stroke-width: 2.2; marker-end: url(#arrowhead); }
      .qc { fill: #f9fafb; stroke: #6b7280; stroke-width: 1.6; }
      .accent { fill: #eef2ff; stroke: #4f46e5; stroke-width: 2; }
    ]]></style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#1f2937"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="900" fill="#ffffff"/>
  <text x="60" y="60" class="title">Figure 1. IPEDS Harmonization Pipeline (2004–2024)</text>

  <!-- Row 1 -->
  <rect x="60" y="100" width="300" height="110" class="box"/>
  <text x="80" y="135" class="label">00_download_ipeds.py</text>
  <text x="80" y="160" class="small">Fetch raw cross‑section data</text>
  <text x="80" y="182" class="small">Raw_Cross_Section_Data/</text>

  <rect x="420" y="100" width="300" height="110" class="box"/>
  <text x="440" y="135" class="label">01_ingest_dictionaries.py</text>
  <text x="440" y="160" class="small">Build dictionary lake + codes</text>
  <text x="440" y="182" class="small">Dictionary/</text>

  <rect x="780" y="100" width="300" height="110" class="box"/>
  <text x="800" y="135" class="label">03_harmonize.py</text>
  <text x="800" y="160" class="small">Per‑year long panels</text>
  <text x="800" y="182" class="small">Cross_sections/</text>

  <rect x="1140" y="100" width="200" height="110" class="box"/>
  <text x="1160" y="140" class="label">Stitch long</text>
  <text x="1160" y="165" class="small">panel_long</text>

  <!-- Row 2 -->
  <rect x="60" y="280" width="300" height="110" class="box"/>
  <text x="80" y="315" class="label">04_build_wide_panel.py</text>
  <text x="80" y="340" class="small">Wide panel by year</text>
  <text x="80" y="362" class="small">Panels/wide_2004_2024/</text>

  <rect x="420" y="280" width="300" height="110" class="box"/>
  <text x="440" y="315" class="label">Wide stitch</text>
  <text x="440" y="340" class="small">2004_2024_IPEDS_Raw_Panel_DS.parquet</text>

  <rect x="780" y="280" width="300" height="110" class="box"/>
  <text x="800" y="315" class="label">05_cleaning_panel.py</text>
  <text x="800" y="340" class="small">PRCH clean (safe)</text>
  <text x="800" y="362" class="small">2004_2024_IPEDS_PRCHclean_Panel_DS.parquet</text>

  <rect x="1140" y="280" width="200" height="110" class="box"/>
  <text x="1160" y="315" class="label">Clean panel</text>
  <text x="1160" y="340" class="small">Drop X* flags</text>
  <text x="1160" y="362" class="small">2004_2024_IPEDS_clean_Panel_DS.parquet</text>

  <!-- Row 3 -->
  <rect x="60" y="460" width="300" height="110" class="box"/>
  <text x="80" y="495" class="label">06_build_custom_panel.py</text>
  <text x="80" y="520" class="small">User‑selected variables</text>

  <rect x="420" y="460" width="300" height="110" class="box"/>
  <text x="440" y="495" class="label">07_panel_QA.py</text>
  <text x="440" y="520" class="small">Raw vs clean QA</text>

  <rect x="780" y="460" width="300" height="110" class="box"/>
  <text x="800" y="495" class="label">09_paper_metrics.py</text>
  <text x="800" y="520" class="small">Release + mapping + QC metrics</text>

  <!-- QC bubbles -->
  <rect x="60" y="640" width="260" height="90" class="qc"/>
  <text x="80" y="670" class="label">Release QC</text>
  <text x="80" y="695" class="small">Checks/release_qc/</text>

  <rect x="360" y="640" width="260" height="90" class="qc"/>
  <text x="380" y="670" class="label">Discrete QC</text>
  <text x="380" y="695" class="small">Checks/disc_qc/</text>

  <rect x="660" y="640" width="260" height="90" class="qc"/>
  <text x="680" y="670" class="label">PRCH QC</text>
  <text x="680" y="695" class="small">Checks/prch_qc/</text>

  <rect x="960" y="640" width="260" height="90" class="qc"/>
  <text x="980" y="670" class="label">QA Summary</text>
  <text x="980" y="695" class="small">Checks/panel_qc/</text>

  <!-- Arrows -->
  <line x1="360" y1="155" x2="420" y2="155" class="arrow"/>
  <line x1="720" y1="155" x2="780" y2="155" class="arrow"/>
  <line x1="1080" y1="155" x2="1140" y2="155" class="arrow"/>

  <line x1="1240" y1="210" x2="210" y2="280" class="arrow"/>
  <line x1="360" y1="335" x2="420" y2="335" class="arrow"/>
  <line x1="720" y1="335" x2="780" y2="335" class="arrow"/>
  <line x1="1080" y1="335" x2="1140" y2="335" class="arrow"/>

  <line x1="360" y1="515" x2="420" y2="515" class="arrow"/>
  <line x1="720" y1="515" x2="780" y2="515" class="arrow"/>

  <line x1="210" y1="210" x2="190" y2="640" class="arrow"/>
  <line x1="930" y1="390" x2="790" y2="640" class="arrow"/>
  <line x1="540" y1="390" x2="490" y2="640" class="arrow"/>
  <line x1="1080" y1="515" x2="1050" y2="640" class="arrow"/>

  <!-- Accent footer -->
  <rect x="60" y="780" width="1280" height="80" class="accent"/>
  <text x="80" y="815" class="label">Key outputs:</text>
  <text x="200" y="815" class="small">Raw wide → PRCH clean → Research‑ready clean → Custom subsets</text>
</svg>
